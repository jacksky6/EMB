[include mcu/EMU_1.cfg]

[tca9548a mux1]
i2c_mcu: EMU_1
i2c_bus: i2c1_PB6_PB7   # STM32G0B1
i2c_address: 112 # 0x70, A0/A1/A2 all low; use 113-119 for 0x71-0x77
environment_report_time: 120
reset_pin: EMU_1:PC12
reset_active_high: True

# On a failed AHT transfer, set either displayed value to zero instead of
# retaining its previous valid value. Set these only in this mux section.
zero_temperature_on_error: True
zero_humidity_on_error: True

#
pause_env_on_toolchange: True



[mcu EMU_1]
canbus_uuid: <replace with your EMB-C CAN UUID>  # Change this to your EMB-C CAN UUID.
#canbus_interface: can1         # Uncomment if using a CAN bus other than can0
#serial: <replace with your /dev/serial/by-id/...> and comment out canbus_uuid above


[AFC_EMU EMU_1]
hub: EMU_1_HUB
extruder: extruder
buffer: EMU_1_buffer
# The following speeds below are conservative, speeds have been tested up to 500mm/s, recommended
# running speeds at 400mm/s or less.
long_moves_speed: 200
long_moves_accel: 120
#long_moves_speed: 300
#long_moves_accel: 300

load_then_home: True    # Home after loading. Default: True.
load_undershoot: 200     # Deceleration distance. Default: 20. The fast move distance is dist_hub - load_undershoot.


[AFC_stepper lane1]
unit: EMU_1:1
step_pin: EMU_1:MOT1_STEP
dir_pin: !EMU_1:MOT1_DIR
enable_pin: !EMU_1:MOT1_EN
microsteps: 4
rotation_distance: 22.7574
gear_ratio: 1:1
dist_hub: 1867.93
led_index: EMU_1_Indicator_1:1
led_spool_index: EMU_1_Indicator_1:2
prep: ^EMU_1:TRG1
load: ^EMU_1:LOAD1
print_current: 0.55

[tmc2209 AFC_stepper lane1]
uart_pin: EMU_1:MOT1_UART
uart_address: 0
run_current: 0.8
sense_resistor: 0.110

[AFC_button lane1]
pin: ^EMU_1:BUTTON1

[temperature_sensor lane1]
sensor_type: AHT2X_TCA9548A
tca9548a: mux1
tca9548a_channel: 0
i2c_address: 56
min_temp: -20
max_temp: 80
# sensor_type: BME280_TCA9548A
# i2c_address: 118


[controller_fan EMU_1_fan_lane1]
pin: EMU_1:FAN1
max_power: 1
kick_start_time: 0.5
stepper: AFC_stepper lane1


[AFC_led EMU_1_Indicator_1]
pin: EMU_1:RGB1
chain_count: 2
color_order: GRBW
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 0.0


[AFC_stepper lane2]
unit: EMU_1:2
step_pin: EMU_1:MOT2_STEP
dir_pin: !EMU_1:MOT2_DIR
enable_pin: !EMU_1:MOT2_EN
microsteps: 4
rotation_distance: 22.7574
gear_ratio: 1:1
dist_hub: 1794.93
led_index: EMU_1_Indicator_2:1
led_spool_index: EMU_1_Indicator_2:2
prep: ^EMU_1:TRG2
load: ^EMU_1:LOAD2
print_current: 0.6

[tmc2209 AFC_stepper lane2]
uart_pin: EMU_1:MOT2_UART
uart_address: 0
run_current: 0.8
sense_resistor: 0.110

[AFC_button lane2]
pin: ^EMU_1:BUTTON2

[temperature_sensor lane2]
sensor_type: AHT2X_TCA9548A
tca9548a: mux1
tca9548a_channel: 1
i2c_address: 56
min_temp: -20
max_temp: 80
# sensor_type: BME280_TCA9548A
# i2c_address: 118

[controller_fan EMU_1_fan_lane2]
pin: EMU_1:FAN2
max_power: 1
kick_start_time: 0.5
stepper: AFC_stepper lane2


[AFC_led EMU_1_Indicator_2]
pin: EMU_1:RGB2
chain_count: 2
color_order: GRBW
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 0.0


[AFC_buffer EMU_1_buffer]
type: FPS_PSF
adc_pin: EMU_1:TH1
neutral_point: 0.5
max_tension: 0.1
max_compression: 0.9

reversed: True  #Test slide by hand and look at buffer state in mainsail/fluidd Set to true if display shows opposite of your tested state.

homing_high_point: 0.8
#    Default: 0.7
#    Forward/trigger threshold used when evaluating the load endstop and homing the buffer.
deadband: 0.30

# The EMU hub uses virtual by default; no physical sensor is connected.
# To use a physical hub sensor:
#
# - Replace "virtual" with the actual sensor pin;
# - Update dist_hub in every [AFC_stepper] section
#   to the PTFE length between the load sensor and hub sensor;
# - Remove or comment out `use_dist_hub: True`.
# use_dist_hub uses each lane's dist_hub as its Bowden load length. Without a shared physical hub, this distance can differ between lanes.

[AFC_hub EMU_1_HUB]
afc_bowden_length: 2000
hub_clear_move_dis: 5
switch_pin: virtual
use_dist_hub: True
