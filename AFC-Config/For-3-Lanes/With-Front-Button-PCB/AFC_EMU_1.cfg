[include mcu/EMU_1.cfg]

[tca9548a mux1]
i2c_mcu: EMU_1
i2c_bus: i2c1_PB6_PB7   # STM32G0B1
i2c_address: 112 # 0x70, A0/A1/A2 all low; use 113-119 for 0x71-0x77
environment_report_time: 120
reset_pin: EMU_1:PC12
reset_active_high: True

# On a failed AHT transfer, set either displayed value to zero instead of
# retaining its previous valid value. Set these only in this mux section.
zero_temperature_on_error: True
zero_humidity_on_error: True

#
pause_env_on_toolchange: True



[mcu EMU_1]
canbus_uuid: <replace with your EMB-C CAN UUID>  # Change this to your EMB-C CAN UUID.
#canbus_interface: can1         # Uncomment if using a CAN bus other than can0
#serial: <replace with your /dev/serial/by-id/...> and comment out canbus_uuid above


[AFC_EMU EMU_1]
hub: EMU_1_HUB
extruder: extruder
buffer: EMU_1_buffer
# The following speeds below are conservative, speeds have been tested up to 500mm/s, recommended
# running speeds at 400mm/s or less.
long_moves_speed: 200
long_moves_accel: 120
#long_moves_speed: 300
#long_moves_accel: 300

load_then_home: True    # 加载后进行终点探测，默认是True
load_undershoot: 200     # 提前减速的距离，默认是20. 快速移动的距离是dist_hub-load_undershoot


[AFC_stepper lane1]
unit: EMU_1:1
step_pin: EMU_1:MOT1_STEP
dir_pin: !EMU_1:MOT1_DIR
enable_pin: !EMU_1:MOT1_EN
microsteps: 4
rotation_distance: 22.7574
gear_ratio: 1:1
dist_hub: 1867.93
led_index: EMU_1_Indicator_1:1-4
led_spool_index: EMU_1_Indicator_1:5
prep: ^EMU_1:TRG1
load: ^EMU_1:LOAD1
print_current: 0.55

[tmc2209 AFC_stepper lane1]
uart_pin: EMU_1:MOT1_UART
uart_address: 0
run_current: 0.8
sense_resistor: 0.110

[AFC_button lane1]
pin: ^EMU_1:BUTTON1

[temperature_sensor lane1]
sensor_type: AHT2X_TCA9548A
tca9548a: mux1
tca9548a_channel: 0
i2c_address: 56
min_temp: -20
max_temp: 80
# sensor_type: BME280_TCA9548A
# i2c_address: 118


[controller_fan EMU_1_fan_lane1]
pin: EMU_1:FAN1
max_power: 1
kick_start_time: 0.5
stepper: AFC_stepper lane1


[AFC_led EMU_1_Indicator_1]
pin: EMU_1:RGB1
chain_count: 5
color_order: GRBW
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 0.0


[AFC_stepper lane2]
unit: EMU_1:2
step_pin: EMU_1:MOT2_STEP
dir_pin: !EMU_1:MOT2_DIR
enable_pin: !EMU_1:MOT2_EN
microsteps: 4
rotation_distance: 22.7574
gear_ratio: 1:1
dist_hub: 1794.93
led_index: EMU_1_Indicator_2:1-4
led_spool_index: EMU_1_Indicator_2:5
prep: ^EMU_1:TRG2
load: ^EMU_1:LOAD2
print_current: 0.6

[tmc2209 AFC_stepper lane2]
uart_pin: EMU_1:MOT2_UART
uart_address: 0
run_current: 0.8
sense_resistor: 0.110

[AFC_button lane2]
pin: ^EMU_1:BUTTON2

[temperature_sensor lane2]
sensor_type: AHT2X_TCA9548A
tca9548a: mux1
tca9548a_channel: 1
i2c_address: 56
min_temp: -20
max_temp: 80
# sensor_type: BME280_TCA9548A
# i2c_address: 118

[controller_fan EMU_1_fan_lane2]
pin: EMU_1:FAN2
max_power: 1
kick_start_time: 0.5
stepper: AFC_stepper lane2


[AFC_led EMU_1_Indicator_2]
pin: EMU_1:RGB2
chain_count: 5
color_order: GRBW
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 0.0


[AFC_stepper lane3]
unit: EMU_1:3
step_pin: EMU_1:MOT3_STEP
dir_pin: !EMU_1:MOT3_DIR
#临时改动
#dir_pin: EMU_1:MOT3_DIR
enable_pin: !EMU_1:MOT3_EN
microsteps: 4
rotation_distance: 22.7574
gear_ratio: 1:1
dist_hub: 1764.89
led_index: EMU_1_Indicator_3:1-4
led_spool_index: EMU_1_Indicator_3:5
prep: ^EMU_1:TRG3
load: ^EMU_1:LOAD3

print_current: 0.6

[tmc2209 AFC_stepper lane3]
uart_pin: EMU_1:MOT3_UART
uart_address: 0
run_current: 0.8
sense_resistor: 0.110

[AFC_button lane3]
pin: ^EMU_1:BUTTON3

[temperature_sensor lane3]
sensor_type: AHT2X_TCA9548A
tca9548a: mux1
tca9548a_channel: 2
i2c_address: 56
min_temp: -20
max_temp: 80
## sensor_type: BME280_TCA9548A
## i2c_address: 118

[controller_fan EMU_1_fan_lane3]
pin: EMU_1:FAN3
max_power: 1
kick_start_time: 0.5
stepper: AFC_stepper lane3


[AFC_led EMU_1_Indicator_3]
pin: EMU_1:RGB3
chain_count: 5
color_order: GRBW
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 0.0


[AFC_buffer EMU_1_buffer]
type: FPS_PSF
adc_pin: EMU_1:TH1
neutral_point: 0.5
max_tension: 0.1
max_compression: 0.9

reversed: True  #Test slide by hand and look at buffer state in mainsail/fluidd Set to true if display shows opposite of your tested state.

homing_high_point: 0.8
#    默认值：0.7
#    将其作为加载终点判断，缓冲器归零（homing）时使用的前进/触发阈值。
deadband: 0.30

# EMU hub 默认使用 virtual（虚拟传感器），不连接实体传感器。
# 如果要使用实体 hub 传感器：
#
# - 将 "virtual" 替换为实际的传感器引脚；
# - 更新每个 [AFC_stepper] 配置段中的 dist_hub，
#   将其设置为 load 传感器与 hub 传感器之间的 PTFE 管长度；
# - 删除或注释掉 `use_dist_hub: True` 这一行。
# use_dist_hub的意思是使用每个lane的dist_hub作为bowden的加载长度。因为不使用hub每个通道的这个距离会不一样。

[AFC_hub EMU_1_HUB]
afc_bowden_length: 2000
hub_clear_move_dis: 5
switch_pin: virtual
use_dist_hub: True
