# EMB-C board configuration. Include this file from printer.cfg before Happy Hare generated configuration.
#
# EMB-C CAN MCU
[mcu unit0]
canbus_uuid:           # Set this to the EMB-C CAN UUID.
canbus_interface: can0




# TCA9548A I2C MULTIPLEXER AND ENVIRONMENT SENSORS
[tca9548a mux1]
# EMB-C uses I2C1 on PB6/PB7 for the TCA9548A multiplexer.
i2c_mcu: unit0
i2c_bus: i2c1_PB6_PB7
# 0x70 with A0/A1/A2 tied low; use 113-119 for 0x71-0x77.
i2c_address: 112
# Poll every downstream environment sensor at this shared interval, in seconds.
environment_report_time: 120
# EMB-C board N-MOS circuit: PC12 high pulls TCA RST low; PC12 low runs normally.
# Do not use Klipper's ! inversion prefix with reset_pin.
reset_pin: unit0:PC12
reset_active_high: True
# Report 0 instead of the last valid value when a supported sensor I2C transfer fails.
# Set these options only here, not in a [temperature_sensor] section.
zero_temperature_on_error: True
zero_humidity_on_error: True
# Skip sampling while AFC or Happy Hare changes filament during a print.
pause_env_on_toolchange: True

[temperature_sensor unit0_Env0]
sensor_type: AHT2X_TCA9548A
tca9548a: mux1
tca9548a_channel: 0
i2c_address: 56
min_temp: -20
max_temp: 80

[temperature_sensor unit0_Env1]
sensor_type: AHT2X_TCA9548A
tca9548a: mux1
tca9548a_channel: 1
i2c_address: 56
min_temp: -20
max_temp: 80

[temperature_sensor unit0_Env2]
sensor_type: AHT2X_TCA9548A
tca9548a: mux1
tca9548a_channel: 2
i2c_address: 56
min_temp: -20
max_temp: 80

[temperature_sensor unit0_Env3]
sensor_type: AHT2X_TCA9548A
tca9548a: mux1
tca9548a_channel: 3
i2c_address: 56
min_temp: -20
max_temp: 80

[temperature_sensor unit0_Env4]
sensor_type: AHT2X_TCA9548A
tca9548a: mux1
tca9548a_channel: 4
i2c_address: 56
min_temp: -20
max_temp: 80






# OPTIONAL PER-GATE CONTROLLER FANS
# EMU does not need these fans unless operating in an unusually hot environment.
# Enabling them only adds noise. Uncomment the sections below if cooling is required.
# Klipper controls each fan while its corresponding gear stepper is enabled.
# They are intentionally not managed by Happy Hare or MMU_FAN.
# [controller_fan unit0_gear_fan0]
# pin: unit0:PA13
# max_power: 1.0
# kick_start_time: 0.5
# fan_speed: 0.6
# idle_timeout: 30
# stepper: mmu_stepper unit0_gear
# heater:  # Keep empty so the extruder heater does not enable this fan.

# [controller_fan unit0_gear_fan1]
# pin: unit0:PB15
# max_power: 1.0
# kick_start_time: 0.5
# fan_speed: 0.6
# idle_timeout: 30
# stepper: mmu_stepper unit0_gear_1
# heater:  # Keep empty so the extruder heater does not enable this fan.

# [controller_fan unit0_gear_fan2]
# pin: unit0:PB14
# max_power: 1.0
# kick_start_time: 0.5
# fan_speed: 0.6
# idle_timeout: 30
# stepper: mmu_stepper unit0_gear_2
# heater:  # Keep empty so the extruder heater does not enable this fan.

# [controller_fan unit0_gear_fan3]
# pin: unit0:PB13
# max_power: 1.0
# kick_start_time: 0.5
# fan_speed: 0.6
# idle_timeout: 30
