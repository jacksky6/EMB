# stepper: mmu_stepper unit0_gear_4
# heater:  # Keep empty so the extruder heater does not enable this fan.




# PER-GATE EJECT BUTTONS
[gcode_button unit0_eject0]
pin: ^unit0:PA10
press_gcode:
    MMU_EJECT UNIT=unit0 LGATE=0

[gcode_button unit0_eject1]
pin: ^unit0:PD9
press_gcode:
    MMU_EJECT UNIT=unit0 LGATE=1

[gcode_button unit0_eject2]
pin: ^unit0:PD8
press_gcode:
    MMU_EJECT UNIT=unit0 LGATE=2

[gcode_button unit0_eject3]
pin: ^unit0:PC7
press_gcode:
    MMU_EJECT UNIT=unit0 LGATE=3

[gcode_button unit0_eject4]
pin: ^unit0:PC6
press_gcode:
    MMU_EJECT UNIT=unit0 LGATE=4
